# E014 — document-frequency ceiling sweep. Team Diamond.
#
# STATUS: PROPOSAL. No variant has run. Do not quote any number here as measured.
#
# Question: does raising the DF ceilings recover enough true pairs to justify
# the additional candidate-generation cost?
#
# Baseline (E011, MEASURED): union pair recall 0.7766 at ceilings
# name_token<=50, address_token<=200, numeric_token<=200. F_0.5 >= 0.95 needs
# pair recall >= 0.7917, so the sweep must find >= ~1.5 points of recall
# before the matcher is worth touching.
#
# Design: fixed query sample, full vendor pool, identical normalization and
# ground truth, seed 17 throughout. One ceiling moves per variant (V1-V3);
# V4 checks the interaction only — the promotion decision is made on V1-V3.
# Every variant saves its bitmask; the miss partition is rerun per variant
# via analyze_retrieval_misses.py --bitmask-input.
#
# Screen on 20,000 queries first (cheap), then confirm ONLY the promoted
# variant at the full 200,000-query E011 scale. A variant that wins on 20K
# but cannot be confirmed at 200K is not promoted.
#
# Success criterion: marginal recalled pairs per additional candidate-pair
# volume (candidate_volume block) is reported for every variant, AND the
# absolute union gain is large enough to matter against the 0.7917 target.
# A variant that adds millions of pairs for a handful of recalls fails even
# if its recall delta is positive.

e014:
  seed: 17
  screen_query_rows: 20000
  confirm_query_rows: 200000
  vendor_pool: train source2 + source3, full (10,320,219)
  normalization: identical (normalize_columns defaults)
  ground_truth: train (labels never touch test)

  baseline_ceilings: # == E011. `--ceiling` absent.
    name_token: 50
    address_token: 200
    numeric_token: 200

  variants: # `--ceiling` flags per variant. Nothing else changes.
    V0_baseline: []
    V1_name_token_200:
      - name_token=200
    V2_address_token_1000:
      - address_token=1000
    V3_numeric_token_1000:
      - numeric_token=1000
    V4_combined_200_1000_1000:
      - name_token=200
      - address_token=1000
      - numeric_token=1000

  per_variant_artifacts:
    bitmask: experiments/results/E014_<variant>_bitmask.parquet
    report: experiments/results/E014_<variant>_recall.json
    miss_analysis: experiments/results/E014_<variant>_miss_analysis.json

  record_per_variant:
    - pair recall and entity hit-rate (bitmask report)
    - coverage histogram (bitmask report)
    - recall_by_country (bitmask report)
    - candidate_volume per strategy (bitmask report)
    - marginal recovered pairs vs V0 (same sample => paired comparison)
    - recall gained per additional candidate-pair volume
    - miss partition rerun (analyze script on the variant bitmask)
    - runtime and peak RSS

  forbidden: # absolute; a run that does any of these is invalid
    - test data or test labels
    - external lookup
    - model training
    - new retrieval strategies (no n-grams, embeddings, transliteration, fuzzy)
    - changing the four exact strategies or normalization

# SCREEN ADVANCEMENT RULE (pre-declared 2026-09-27, BEFORE results exist).
# A variant advances to the 200K confirmation iff ALL of R1-R4 hold on the
# paired 20K sample (same queries for every variant, so the comparison is
# paired and sampling noise cancels directionally):
#
# R1 materiality: net recovered pairs vs V0 >= 0.1% of sample true pairs
#    (~70 pairs at 20K scale). Below this the gain is noise against the
#    0.7917 target regardless of efficiency.
# R2 no entity regression: entity hit-rate delta vs V0 >= 0.
# R3 country consistency: pair-recall delta >= 0 in EACH of IN and US
#    (FR is absent from train; reported, never imputed). A gain confined to
#    one country is a narrow effect, not a ceiling effect.
# R4 source consistency: pair-recall delta >= 0 for EACH of S2 and S3
#    true pairs (from the per-variant miss-analysis rerun).
# R5 efficiency tiebreak (only among variants passing R1-R4): rank by
#    recovered-pairs per additional candidate-pair volume; a variant with
#    10x worse efficiency advances only if its absolute gain is 3x larger.
# R6 narrowness flag (informative, not a gate): if >50% of a variant's
#    recovered pairs come from a single key block, record it; the 200K
#    confirmation is then scoped to check breadth, not just size.
#
# Outcomes: none pass R1-R4 -> STOP E014, ceiling hypothesis unsupported.
# One passes -> confirm ONLY it at 200K. Several pass -> advance the smallest
# number that resolves the uncertainty (efficiency first). V0 is NOT rerun at
# 200K: E011 is the full-corpus baseline unless apples-to-apples demands it.
advancement_rule:
  materiality_floor_pairs_pct: 0.1
  entity_hitrate_delta_min: 0.0
  country_deltas_min: 0.0
  source_deltas_min: 0.0
  efficiency_tiebreak_ratio: 10.0
  efficiency_absolute_override: 3.0
  narrowness_single_block_pct: 50.0
